[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ldct-io"
version = "0.2.0"
description = "Read, reconstruct and measure real CT projection data (DICOM-CT-PD), for task-based image quality on scanner data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuji Yamamoto", email = "yamamoto@lisit.jp" }]
keywords = [
  "computed tomography",
  "DICOM-CT-PD",
  "projection data",
  "filtered backprojection",
  "MTF",
  "NPS",
  "image quality",
  "reproducible research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydicom>=2.3",
]

[project.optional-dependencies]
# Figures are a convenience, not part of the measurement.
plot = ["matplotlib>=3.7"]
# The learned arms. ldct_io.adversarial told the reader to install this extra before it
# existed, so anyone following that message got nothing; the message is only true if the
# extra is declared. Scoring those arms additionally needs denoiq-core and taskiq-core, which
# are separate packages rather than dependencies: this one supplies the data and the
# measurement, they supply the observers and the denoisers, and neither reproduces the paper
# alone. See README.
cnn = ["torch>=2.0", "scipy>=1.10"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Institute-of-One/ldct-io"
Repository = "https://github.com/Institute-of-One/ldct-io"
Issues = "https://github.com/Institute-of-One/ldct-io/issues"

[tool.setuptools.packages.find]
include = ["ldct_io*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  # Our own deprecations are errors, so they get fixed rather than accumulated.
  "error::DeprecationWarning",
  "ignore::DeprecationWarning:numpy",
  "ignore::DeprecationWarning:scipy",
  "ignore::DeprecationWarning:pydicom",
  "ignore::DeprecationWarning:matplotlib",
  # Raised by CPython while importing a SWIG-built extension that pydicom's pixel-data
  # handlers pull in. It is emitted from inside the C import machinery, where turning a
  # warning into an exception does not raise -- it segfaults the interpreter, with no
  # output at all. The message is matched rather than the module because the warning is
  # attributed to <frozen importlib._bootstrap>, not to the package that caused it.
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "D"]
# D203/D213: mutually exclusive docstring layouts (we use D211/D212).
# D401/D404: imperative-mood checks that misfire on descriptive attribute docstrings.
ignore = ["D203", "D213", "D401", "D404"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"examples/*" = ["D100", "D103"]

[tool.mypy]
python_version = "3.12"
strict = true
# numpy operations are typed as returning Any, so warn_return_any fires on almost every
# array-returning function. The valuable checks (untyped defs, untyped calls) stay on.
warn_return_any = false

[[tool.mypy.overrides]]
module = ["scipy.*", "pydicom.*", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
